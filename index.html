<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCCQ | Laboratorio de Contraste Crítico</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#183247;font:16px system-ui}header{background:#12354c;color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header h1{margin:0;font-size:28px}header small{color:#c4dce7}main{max-width:1200px;margin:auto;padding:24px;display:grid;grid-template-columns:250px 1fr;gap:22px}aside,article,.panel{background:white;border:1px solid #d5e0e8;border-radius:12px;padding:20px}h2,h3{margin-top:0}button,input,select,textarea{font:inherit}button{background:#176d70;color:white;border:0;border-radius:7px;padding:10px 15px;cursor:pointer;margin:4px 3px}button.secondary{background:#e4edf4;color:#183247}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #d68a22}aside button{display:block;width:100%;text-align:left;margin:5px 0}aside button.current{background:#12354c;color:white}textarea,input,select{width:100%;padding:10px;border:1px solid #aabecb;border-radius:6px;margin:6px 0 14px;background:white;color:#183247}textarea{min-height:90px}label{display:block;font-weight:600}label.option{font-weight:400;border:1px solid #d5e0e8;padding:10px;margin:8px 0;border-radius:7px}input[type=radio]{width:auto;margin:0 8px 0 0}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{border-bottom:1px solid #d5e0e8;text-align:left;padding:10px}th{background:#eaf2f6}.note{background:#e8f4f2;border-left:4px solid #176d70;padding:14px;margin:14px 0}.ai{background:#f0eaf8;border-left:4px solid #7654a0;padding:15px;margin:12px 0}.muted{color:#526a7b;font-size:14px}.bar{background:#dce6ed;height:10px;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#168478}.chart div{display:flex;align-items:center;gap:12px;margin:10px 0}.chart b{width:120px;font-size:14px}.chart i{display:block;background:#368a93;height:22px;border-radius:3px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.panel{margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}footer{padding:20px;text-align:center;color:#526a7b}@media(max-width:720px){main{grid-template-columns:1fr;padding:12px}aside{padding:10px}aside nav{display:grid;grid-template-columns:1fr 1fr}article{padding:14px}}@media print{header button,aside,button,footer{display:none!important}main{display:block}article{border:0}textarea{min-height:100px}body{background:white}}
</style><header><div><h1>⚗ LCCQ</h1><small>Laboratorio de Contraste Crítico en Química · Grado 11</small></div><div><button onclick="home()">Inicio</button><button onclick="teacher()">Docente investigador</button></div></header><main><aside id="side"></aside><article id="app" aria-live="polite"></article></main><footer>Santa María Goretti · Montería · Prototipo de investigación v0.1 · Datos locales</footer><script>
const modules=['Situación problema ABP','Banco de evidencias','Texto generado por IA','Detector crítico','Contraste químico','Argumenta','Desafía a la IA','Decisión ABP','Metacognición y transferencia','Portafolio de evidencias'];
const cases=[{id:'agua',title:'¿Qué podemos concluir sobre la calidad del agua?',context:'Una comunidad cercana al río Sinú observa cambios en el agua después de las lluvias. Un comité escolar debe recomendar qué investigar antes de decidir si el agua es apta para consumo. Los datos son ficticios y no describen el río real.',headers:['Muestra','pH','Turbidez (NTU)','Nitratos (mg/L)'],rows:[['A: arriba, sin lluvia',7.1,4,3],['B: abajo, con lluvia',6.8,42,9],['C: arriba, con lluvia',7,31,4],['D: abajo, sin lluvia',7,7,5]],chart:2,question:'¿Cuál conclusión está mejor respaldada por los datos?',options:['El pH cercano a 7 demuestra potabilidad.','La lluvia es la única causa del aumento de nitratos.','Hay diferencias fisicoquímicas y se necesitan análisis adicionales.','La turbidez demuestra presencia de patógenos.'],key:2,feedback:'Los parámetros medidos no identifican patógenos ni prueban causalidad o potabilidad. Se requieren análisis adicionales y réplicas.',ai:['Las muestras posteriores a la lluvia tienen mayor turbidez en ambas ubicaciones.','El pH cercano a 7 garantiza que el agua es potable.','Los nitratos aumentan después de la lluvia; por tanto una finca específica es responsable.'],sources:['E1: tabla simulada de mediciones, sin réplicas.','E2: el pH expresa acidez; no identifica microorganismos.','E3: la turbidez mide dispersión de luz por partículas; no identifica su origen.','E4: un vecino atribuye el cambio a una finca, sin mediciones.'],model:'Escorrentía → transporte posible de partículas y solutos → cambios medibles. La asociación no demuestra una causa única.',transfer:{q:'En otro arroyo, dos muestras tienen pH 7 y 7,2; no hay análisis microbiológico. ¿Qué conclusión es válida?',o:['Ambas son potables.','No puede establecerse potabilidad con esos datos.','La segunda contiene más patógenos.','La primera no contiene solutos.'],k:1},hints:['Compara muestras de la misma ubicación.','Distingue lo medido de lo que todavía no se ha medido.']},{id:'metal',title:'¿Cómo proteger las estructuras metálicas?',context:'La escuela necesita elegir una estrategia de protección para estructuras de hierro expuestas a humedad. Un equipo compara muestras del mismo hierro durante siete días. Los resultados son simulados.',headers:['Condición','Área oxidada (%)'],rows:[['Seco',2],['Húmedo',24],['Agua salina',65],['Húmedo con pintura intacta',3]],chart:1,question:'¿Qué decisión está mejor sustentada por el ensayo?',options:['La sal impide la oxidación.','La pintura intacta puede reducir la corrosión en condiciones húmedas.','El oxígeno es el único factor que determina la corrosión.','La humedad no influye en el deterioro.'],key:1,feedback:'La comparación húmedo frente a húmedo con pintura respalda una reducción bajo las condiciones ensayadas; no garantiza protección permanente.',ai:['En el ensayo, el hierro húmedo sin pintura presenta más área oxidada que el pintado.','La corrosión depende exclusivamente del oxígeno.','La pintura reduce el deterioro observado, por lo que protege cualquier metal para siempre.'],sources:['E1: tabla simulada de áreas oxidadas, sin réplicas.','E2: oxidación del hierro: Fe → Fe²⁺ + 2e⁻.','E3: agua y electrolitos facilitan procesos electroquímicos de corrosión.','E4: publicidad de pintura que promete protección ilimitada sin datos.'],model:'Oxidación del hierro + reacción catódica → productos de corrosión. Una barrera puede limitar el contacto con el medio.',transfer:{q:'Dos tornillos iguales se mantienen en agua dulce y salina durante igual tiempo. El salino presenta más corrosión. ¿Qué conclusión es válida?',o:['La sal siempre destruye cualquier metal.','El agua dulce impide toda corrosión.','En estas condiciones la salinidad se asocia con mayor corrosión.','El oxígeno no participa.'],k:2},hints:['Compara condiciones que difieren en un factor.','Considera qué alcance tiene un ensayo de siete días.']}];
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem('lccq-v1'))||{records:[],config:{},ratings:[],extra:[]}}catch{db={records:[],config:{},ratings:[],extra:[]}};let student='',cid='agua',step=0,mode='home',hint=0;function persist(){try{localStorage.setItem('lccq-v1',JSON.stringify(db));return true}catch(e){alert('No se pudo guardar. Exporta los datos antes de cerrar.');return false}}function allCases(){return [...cases,...db.extra].map(c=>({...c,...db.config[c.id]}))}function C(){return allCases().find(c=>c.id===cid)}function rec(s=step){return db.records.filter(r=>r.student===student&&r.case===cid&&r.step===s)}function latest(s=step){return rec(s).at(-1)?.values||{}}function field(k,t,v='',type='textarea'){return `<label for="${k}">${esc(t)}</label>${type==='input'?`<input id="${k}" value="${esc(v)}">`:`<textarea id="${k}">${esc(v)}</textarea>`}`}function opts(q,o,v){return `<h3>${esc(q)}</h3>`+o.map((x,i)=>`<label class="option"><input type="radio" name="choice" value="${i}" ${String(v)===String(i)?'checked':''}>${'ABCD'[i]}. ${esc(x)}</label>`).join('')}function table(c){return `<table><thead><tr>${c.headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}function graph(c){let max=Math.max(...c.rows.map(r=>Number(r[c.chart])),1);return `<div class="chart" role="img" aria-label="Gráfico de ${esc(c.headers[c.chart])}">${c.rows.map(r=>`<div><b>${esc(r[0])}</b><i style="width:${Math.max(0,Number(r[c.chart])/max*55)}%"></i><span>${esc(r[c.chart])}</span></div>`).join('')}</div>`}function home(){mode='home';$('side').innerHTML='<h3>Tu laboratorio</h3><p>Explora · Contrasta · Argumenta</p><p class="muted">Sin conexión. Usa un código asignado por el docente, nunca tu nombre.</p>';$('app').innerHTML=`<h2>Investiga antes de concluir</h2><p>Resuelve problemas químicos, evalúa explicaciones de IA y construye decisiones fundamentadas.</p><label for="code">Código seudónimo</label><input id="code" value="${esc(student)}" placeholder="E001" maxlength="24"><div class="cards">${allCases().map(c=>`<div class="panel"><h3>${esc(c.title)}</h3><p>${esc(c.context)}</p><button data-case="${esc(c.id)}">Abrir caso</button></div>`).join('')}</div><button onclick="assessment('diagnostico')">Diagnóstico autónomo</button><button onclick="assessment('final')">Evaluación final autónoma</button><p class="muted">Ítems originales tipo Saber 11; no son preguntas oficiales.</p>`;document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{if(!getStudent())return;cid=b.dataset.case;step=0;hint=0;render()})}function getStudent(){let x=$('code')?.value.trim()||student;if(!/^[A-Za-z0-9_-]{2,24}$/.test(x)){alert('Usa un código de 2 a 24 letras, números o guiones.');return false}student=x;return true}
function render(){mode='lab';let c=C(),v=latest(),done=modules.filter((_,i)=>rec(i).length).length;$('side').innerHTML=`<h3>${esc(student)}</h3><div class="bar"><span style="width:${done*10}%"></span></div><p class="muted">${done}/10 módulos registrados</p><nav>${modules.map((m,i)=>`<button class="${i===step?'current':'secondary'}" ${i>=2&&i<=8&&!rec(0).length?'disabled':''} onclick="go(${i})">${i+1}. ${m}</button>`).join('')}</nav>`;let body='',f=(k,t)=>field(k,t,v[k]);switch(step){case 0:body=`<p>${esc(c.context)}</p>${table(c)}${opts(c.question,c.options,v.choice)}${f('reason','Justifica tu elección')}${f('hyp','Formula dos hipótesis alternativas y cómo comprobarlas')}`;break;case 1:body=table(c)+graph(c)+c.sources.map((s,i)=>`<div class="panel"><p>${esc(s)}</p>${['pertinencia','credibilidad','suficiencia'].map(k=>`<label>${k}<select id="e${i}${k}">${['','Alta','Media','Baja','Indeterminada'].map(o=>`<option ${v['e'+i+k]===o?'selected':''}>${o}</option>`).join('')}</select></label>`).join('')}${f('ej'+i,'Justificación de la valoración')}</div>`).join('');break;case 2:body=`<p>Textos didácticos redactados con IA; requieren revisión docente previa.</p>`+c.ai.map((a,i)=>`<div class="ai">Texto ${i+1}: ${esc(a)}</div>`+f('a'+i,'Identifica la afirmación y su grado de certeza')).join('');break;case 3:body=c.ai.map((a,i)=>`<div class="ai">${esc(a)}</div><label>Valoración<select id="d${i}">${['','Respaldada','Contradicha','Insuficientemente sustentada'].map(o=>`<option ${v['d'+i]===o?'selected':''}>${o}</option>`).join('')}</select></label>${f('dj'+i,'Justifica con datos y señala posibles errores')}`).join('');break;case 4:body=table(c)+`<div class="note">Modelo científico: ${esc(c.model)}</div>`+c.ai.map((a,i)=>`<p>${esc(a)}</p>${f('ev'+i,'Evidencia específica y fuente')}${f('qu'+i,'Principio químico y límites de la conclusión')}`).join('');break;case 5:body=['Afirmación','Evidencia','Razonamiento químico','Limitaciones'].map((t,i)=>f('arg'+i,t)).join('');break;case 6:body=f('obj','Formula una objeción o pregunta crítica a la IA')+f('reply','Construye una réplica sustentada')+c.options.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)}</p>${f('opt'+i,'Evalúa esta opción y justifica si la aceptarías o descartarías')}`).join('');break;case 7:body=opts(c.question,c.options,v.choice)+f('reason','Justifica tu respuesta revisada')+f('decision','Propón una solución al problema abierto')+f('team','Registra aportes del debate colaborativo y desacuerdos')+f('limits','Indica limitaciones y próximos pasos');break;case 8:body=opts(c.transfer.q,c.transfer.o,v.choice)+f('reason','Justifica autónomamente')+f('meta','¿Qué cambió en tu razonamiento y por qué?');break;case 9:body=modules.slice(0,9).map((m,i)=>`<details class="panel"><summary>${i+1}. ${m} · ${rec(i).length} versiones</summary>${rec(i).map(r=>`<p class="muted">${esc(r.time)}</p><pre>${esc(JSON.stringify(r.values,null,2))}</pre>`).join('')}</details>`).join('')+f('reflection','Selecciona una producción representativa y explica por qué')+`<button onclick="exportJSON(db.records.filter(r=>r.student===student),'portafolio')">Exportar mi portafolio</button>`;break;}
$('app').innerHTML=`<p class="muted">${esc(c.title)} · Módulo ${step+1}</p><h2>${modules[step]}</h2><p class="muted">Competencias: uso comprensivo · explicación de fenómenos · indagación. Datos simulados.</p>${step===8?'<div class="note">Actividad autónoma: no uses IA ni pistas.</div>':'<div class="note">Instrucción: fundamenta tus respuestas, distingue observación e interpretación y reconoce incertidumbres.</div>'}<div id="fields">${body}</div>${step<8?`<details class="panel"><summary>Ayudas pedagógicas graduadas</summary><button onclick="showHint()">Solicitar pista</button><div id="hints"></div></details>`:''}<div id="status" role="status"></div><button onclick="save()">Guardar nueva versión</button><button class="secondary" onclick="go(${Math.max(0,step-1)})">Anterior</button><button onclick="next()" ${step===9?'disabled':''}>Guardar y continuar</button><button class="secondary" onclick="window.print()">Imprimir módulo</button>`}function showHint(){hint=Math.min(hint+1,C().hints.length);$('hints').innerHTML=C().hints.slice(0,hint).map(x=>`<p>${esc(x)}</p>`).join('')}function go(i){if(i>=2&&i<=8&&!rec(0).length){alert('Registra primero tu respuesta e hipótesis inicial.');return}step=i;hint=0;render()}function save(){let values={};$('fields').querySelectorAll('textarea,input,select').forEach(e=>{if(e.type==='radio'){if(e.checked)values.choice=e.value}else values[e.id]=e.value});if(step===0&&(!('choice'in values)||!values.reason.trim()||!values.hyp.trim())){alert('Completa la elección, justificación e hipótesis inicial.');return false}if(step===8&&(!('choice'in values)||!values.reason.trim())){alert('Completa la respuesta autónoma.');return false}db.records.push({student,case:cid,step,time:new Date().toISOString(),version:rec().length+1,hints:hint,values});if(!persist())return false;$('status').textContent='Versión guardada. Las anteriores se conservan.';return true}function next(){if(save())go(Math.min(9,step+1))}
const tests={diagnostico:[{q:'Una muestra de agua tiene pH 6,9 y baja turbidez. ¿Qué se puede concluir?',o:['Es potable','No contiene sales','Se conocen dos propiedades, no su potabilidad','No contiene bacterias'],k:2},{q:'Dos placas iguales, una seca y otra húmeda, presentan 1% y 20% de oxidación tras siete días. ¿Qué conclusión se sustenta?',o:['La humedad se asocia con mayor oxidación en el ensayo','La humedad es la única causa','La placa seca nunca se oxida','El hierro húmedo cambia de elemento'],k:0},{q:'Para evaluar el efecto de la salinidad en la corrosión, ¿qué diseño conviene?',o:['Cambiar metal y salinidad','Usar hierro igual, mismo tiempo y distinta salinidad','Cambiar tiempo y temperatura','Comparar fotografías sin controles'],k:1}],final:[{q:'Una muestra de pozo tiene pH 7,2 y baja conductividad. ¿Qué se puede concluir?',o:['Es estéril','Es potable','No contiene contaminantes','Se conocen dos propiedades, no su potabilidad'],k:3},{q:'Dos clavos iguales, uno sin recubrimiento y otro pintado, presentan 30% y 4% de oxidación en ambiente húmedo. ¿Qué conclusión se sustenta?',o:['La pintura protege para siempre','La pintura reduce la oxidación en el ensayo','El hierro pintado no reacciona jamás','La humedad no influye'],k:1},{q:'Para evaluar el efecto de la temperatura en una reacción, ¿qué diseño conviene?',o:['Cambiar reactivos y temperatura','Cambiar concentración y volumen','Mantener reactivos y concentración iguales, variar temperatura','Comparar ensayos de distinta duración sin registrar datos'],k:2}]};function assessment(kind){if(!getStudent())return;mode='test';$('side').innerHTML='<h3>Evaluación autónoma</h3><p>Sin pistas ni IA.</p>';$('app').innerHTML=`<h2>${kind==='final'?'Evaluación final':'Diagnóstico inicial'}</h2><p>Ítems originales. Justifica cada elección.</p><div id="testfields">${tests[kind].map((q,i)=>`<section class="panel"><h3>${i+1}. ${esc(q.q)}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${esc(o)}</label>`).join('')}${field('why'+i,'Justificación')}</section>`).join('')}</div><button onclick="saveTest('${kind}')">Entregar evaluación</button>`}function saveTest(kind){let answers=tests[kind].map((q,i)=>({choice:document.querySelector(`input[name=q${i}]:checked`)?.value,reason:$('why'+i).value}));if(answers.some(a=>a.choice===undefined||!a.reason.trim()))return alert('Completa todas las respuestas.');db.records.push({student,case:kind,step:-1,time:new Date().toISOString(),values:{answers,score:answers.filter((a,i)=>Number(a.choice)===tests[kind][i].k).length}});if(persist())home()}
function download(data,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJSON(data=db,name='LCCQ'){download(JSON.stringify(data,null,2),name+'.json','application/json')}function csv(){let rows=[['codigo','caso','modulo','fecha','version','pistas','produccion'],...db.records.map(r=>[r.student,r.case,r.step,r.time,r.version,r.hints,JSON.stringify(r.values)])];download(rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'LCCQ.csv','text/csv;charset=utf-8')}
const rubric=['Pertinencia','Credibilidad','Suficiencia','Razonamiento químico','Argumentación','Contraargumentación'];function teacher(){mode='teacher';$('side').innerHTML='<h3>Docente investigador</h3><p>Uso en equipo supervisado. No hay autenticación real en esta versión.</p><button onclick="home()">Volver al estudiante</button>';$('app').innerHTML=`<h2>Panel de seguimiento</h2><div class="cards"><div class="panel"><h2>${new Set(db.records.map(r=>r.student)).size}</h2>Códigos registrados</div><div class="panel"><h2>${db.records.length}</h2>Producciones</div><div class="panel"><h2>${db.ratings.length}</h2>Valoraciones</div></div><button onclick="exportJSON()">Exportar respaldo JSON</button><button onclick="csv()">Exportar producciones CSV</button><button onclick="printPack()">Guía impresa</button><h3>Portafolios y comparación</h3><label>Código<select id="filter" onchange="showRecords()"><option value="">Todos</option>${[...new Set(db.records.map(r=>r.student))].map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><div id="records"></div><h3>Rúbrica docente</h3>${field('rated','Código del estudiante','','input')}${field('ratedcase','Caso y versión valorada','','input')}<p class="muted">1: incipiente, 2: parcial, 3: consistente, 4: integrado y justificado. Rúbrica preliminar.</p>${rubric.map((r,i)=>`<label>${r}<select id="rub${i}"><option value="">Sin valorar</option>${[1,2,3,4].map(n=>`<option>${n}</option>`).join('')}</select></label>`).join('')}${field('observation','Observación y evidencia que justifica la valoración')}<button onclick="rate()">Guardar valoración</button><details class="panel"><summary>Valoraciones guardadas</summary><pre>${esc(JSON.stringify(db.ratings,null,2))}</pre></details><h3>Configuración de casos</h3><select id="editcase" onchange="editCase()">${allCases().map(c=>`<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('')}</select><div id="edit"></div><details class="panel"><summary>Agregar caso mediante JSON</summary><p>Usa la estructura del caso exportado, con identificador nuevo y clave revisada.</p><button onclick="exportJSON(C(),'plantilla-caso')">Exportar plantilla</button>${field('newcase','JSON del nuevo caso')}<button onclick="addCase()">Agregar caso</button></details>`;showRecords();editCase()}function showRecords(){let s=$('filter').value,rs=db.records.filter(r=>!s||r.student===s);$('records').innerHTML=rs.map(r=>`<details class="panel"><summary>${esc(r.student)} · ${esc(r.case)} · ${r.step<0?'Evaluación':modules[r.step]} · v${r.version||1} · ${esc(r.time)}</summary><pre>${esc(JSON.stringify(r.values,null,2))}</pre></details>`).join('')||'<p>Sin registros.</p>'}function rate(){let s=$('rated').value.trim();if(!s||!$('ratedcase').value.trim()||!$('observation').value.trim())return alert('Completa código, caso y observación.');db.ratings.push({student:s,case:$('ratedcase').value,levels:rubric.map((r,i)=>({criterion:r,level:$('rub'+i).value})),observation:$('observation').value,time:new Date().toISOString()});persist();teacher()}function editCase(){let c=allCases().find(c=>c.id===$('editcase').value);$('edit').innerHTML=field('editcontext','Contexto',c.context)+field('editai','Textos de IA (uno por línea)',c.ai.join('\n'))+field('edithints','Pistas (una por línea)',c.hints.join('\n'))+`<label><input type="checkbox" id="reviewed" ${c.reviewed?'checked':''}> Textos revisados por docente</label><button onclick="saveConfig()">Guardar configuración</button>`}function saveConfig(){let id=$('editcase').value;db.config[id]={context:$('editcontext').value,ai:$('editai').value.split('\n').filter(Boolean),hints:$('edithints').value.split('\n').filter(Boolean),reviewed:$('reviewed').checked};persist();alert('Configuración guardada.')}function addCase(){try{let c=JSON.parse($('newcase').value);if(!c.id||allCases().some(x=>x.id===c.id)||!c.title||!c.context||!Array.isArray(c.rows)||!Array.isArray(c.headers)||!Array.isArray(c.ai)||!Array.isArray(c.sources)||!Array.isArray(c.hints)||c.options?.length!==4||c.transfer?.o?.length!==4||!Number.isInteger(c.key)||c.key<0||c.key>3||!Number.isInteger(c.transfer.k)||c.transfer.k<0||c.transfer.k>3||!Number.isInteger(c.chart)||c.chart<1||c.chart>=c.headers.length||!c.rows.length||c.rows.some(r=>r.length!==c.headers.length||!Number.isFinite(Number(r[c.chart]))))throw Error();db.extra.push(c);persist();teacher()}catch{alert('JSON inválido o incompleto. Revisa la plantilla.')}}function printPack(){let w=window.open('','_blank');if(!w)return alert('Permite ventanas emergentes para imprimir.');w.document.write('<!doctype html><html lang="es"><meta charset="utf-8"><title>Guía LCCQ</title><style>body{font:15px system-ui;margin:30px}table{border-collapse:collapse}td,th{border:1px solid #999;padding:8px}section{break-before:page}p{margin:12px 0}.lines{height:85px;border-bottom:1px solid #aaa}</style><h1>Guía impresa LCCQ</h1><p>Código: __________. Entregar cada etapa antes de recibir la siguiente.</p>'+allCases().map(c=>`<section><h2>${esc(c.title)}</h2><p>${esc(c.context)}</p>${table(c)}<h3>1. ${esc(c.question)}</h3>${c.options.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)}</p>`).join('')}<p>Elección, justificación y dos hipótesis:</p><div class="lines"></div></section><section><h2>2. Banco de evidencias</h2>${c.sources.map(s=>`<p>${esc(s)}: pertinencia, credibilidad, suficiencia y justificación.</p><div class="lines"></div>`).join('')}</section><section><h2>3–5. IA, detector y contraste</h2>${c.ai.map(a=>`<p>${esc(a)}</p><p>Identifica afirmación, valoración, evidencia y principio químico.</p><div class="lines"></div>`).join('')}<p>${esc(c.model)}</p></section><section><h2>6–8. Argumenta, desafía y decide</h2>${['Afirmación','Evidencia','Razonamiento','Contraargumento y réplica','Refutación de distractores','Decisión ABP y limitaciones','Aportes del equipo'].map(t=>`<p>${t}</p><div class="lines"></div>`).join('')}</section><section><h2>9–10. Transferencia y portafolio</h2><p>${esc(c.transfer.q)}</p>${c.transfer.o.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)}</p>`).join('')}<p>Justifica sin ayudas. Reflexiona y conserva tus versiones.</p><div class="lines"></div></section>`).join('')+Object.entries(tests).map(([k,qs])=>`<section><h2>${k}</h2>${qs.map(q=>`<p>${esc(q.q)}</p>${q.o.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)}</p>`).join('')}<div class="lines"></div>`).join('')}</section>`).join(''));w.document.close();w.print()}home();</script></html>
